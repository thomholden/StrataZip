name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and CMake
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev cmake g++
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Self-test
        run: build/stratazip --test
      - name: Package
        run: cd build && cpack -G DEB && cpack -G TGZ
      - uses: actions/upload-artifact@v4
        with:
          name: stratazip-linux-x86_64
          path: |
            build/*.deb
            build/*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stratazip-linux-x86_64
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum *.deb *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" *.deb *.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "StrataZip ${GITHUB_REF_NAME#v}" --generate-notes
