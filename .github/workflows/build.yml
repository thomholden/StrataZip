name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt 6 and CMake
        run: sudo apt-get update && sudo apt-get install -y qt6-base-dev cmake g++
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j"$(nproc)"
      - name: Self-test
        run: build/stratazip --test
      - name: Package
        run: cd build && cpack -G DEB && cpack -G TGZ
      - uses: actions/upload-artifact@v4
        with:
          name: stratazip-linux-x86_64
          path: |
            build/*.deb
            build/*.tar.gz

  install-test:
    # The .deb must install and run on every supported release, not only the one it was
    # built on.
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:24.04', 'ubuntu:26.04']
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: stratazip-linux-x86_64
      - name: Install the package and run it
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./stratazip_*_amd64.deb
          stratazip --version
          head -c 1000000 /dev/urandom > r && stratazip -c r r.stz && stratazip -d r.stz r2 && cmp r r2
          echo "installs and round-trips on ${{ matrix.image }}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, install-test]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          path: src
      - uses: actions/download-artifact@v4
        with:
          name: stratazip-linux-x86_64
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum *.deb *.tar.gz > SHA256SUMS
          # The release notes are the tag's section of CHANGELOG.md, from its heading to the next.
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '/^## / { if (f) exit; if (index($0, "## " v " ") == 1) { f = 1; next } } f' src/CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          gh release create "$GITHUB_REF_NAME" *.deb *.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "StrataZip $v" --notes-file notes.md
